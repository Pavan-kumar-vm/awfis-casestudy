<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Awfis</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .login-box {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 2.25rem;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08),
                    0 2px 6px rgba(0, 0, 0, 0.04);
        margin: 1rem;
      }

      .form-control {
        border-radius: 8px;
        padding: 0.65rem 0.9rem;
        border: 1px solid #ced4da;
      }

      .form-control:focus {
        border-color: #ffc107;
        box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25);
      }

      #emailReq,
      #invalidEmail,
      #pwdReq,
      #InvalidPwd {
        color: #dc3545;
        font-size: 0.8rem;
        text-align: left;
        margin-top: 4px;
        margin-bottom: 0;
        display: none;
      }

      .btn-submit {
        background-color: #198754;
        border: none;
        border-radius: 8px;
        padding: 0.7rem;
        font-weight: 600;
        transition: background-color 0.2s;
      }

      .btn-submit:hover {
        background-color: #157347;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2 class="text-center text-warning fw-bold mb-4">Login Form</h2>

      <form action="" name="loginForm" novalidate>
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold text-secondary">Email</label>
          <input
            type="email"
            name="emailField"
            class="form-control"
            placeholder="name@example.com"
          />
          <p id="emailReq">Email field is required</p>
          <p id="invalidEmail">Invalid Email format</p>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label fw-semibold text-secondary">Password</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter password"
          />
          <p id="pwdReq">Password required</p>
          <p id="InvalidPwd">Invalid password (min 6 characters)</p>
        </div>

        <button id="submitBtn" type="submit" class="btn btn-success btn-submit w-100">
          Submit
        </button>
      </form>
    </div>

    <script>
      const form = document.forms["loginForm"];
      const emailField = form["emailField"];
      const passwordField = form["password"];

      const emailReq = document.getElementById("emailReq");
      const invalidEmail = document.getElementById("invalidEmail");
      const pwdReq = document.getElementById("pwdReq");
      const invalidPwd = document.getElementById("InvalidPwd");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        let isValid = true;

        emailReq.style.display = "none";
        invalidEmail.style.display = "none";
        pwdReq.style.display = "none";
        invalidPwd.style.display = "none";

        const emailValue = emailField.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (emailValue === "") {
          emailReq.style.display = "block";
          isValid = false;
        } else if (!emailRegex.test(emailValue)) {
          invalidEmail.style.display = "block";
          isValid = false;
        }

        const pwdValue = passwordField.value.trim();
        if (pwdValue === "") {
          pwdReq.style.display = "block";
          isValid = false;
        } else if (pwdValue.length < 6) {
          invalidPwd.style.display = "block";
          isValid = false;
        }

        if (isValid) {
          sessionStorage.setItem("isLoggedIn", "true");

          alert("Login successful!");
          form.reset();

          window.location.href = "index.html";
        }
      });
    </script>
  </body>
</html>
