<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px 0;
      }
      .signup-box {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        padding: 2.25rem;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08),
                    0 2px 6px rgba(0, 0, 0, 0.04);
        margin: 1rem;
      }
      .form-control {
        border-radius: 8px;
        padding: 0.65rem 0.9rem;
        border: 1px solid #ced4da;
      }

      .form-control:focus {
        border-color: #ffc107;
        box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25);
      }

      #nameReq,
      #emailReq,
      #invalidEmail,
      #pwdReq,
      #invalidPwd,
      #confirmPwdReq,
      #pwdMismatch {
        color: #dc3545;
        font-size: 0.8rem;
        text-align: left;
        margin-top: 4px;
        margin-bottom: 0;
        display: none;
      }

      .btn-submit {
        background-color: #198754;
        border: none;
        border-radius: 8px;
        padding: 0.7rem;
        font-weight: 600;
        transition: background-color 0.2s;
      }

      .btn-submit:hover {
        background-color: #157347;
      }
    </style>
  </head>
  <body>
    <div class="signup-box">
      <h2 class="text-center text-warning fw-bold mb-4">Create Account</h2>

      <form action="" name="signupForm" novalidate>
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold text-secondary">Full Name</label>
          <input
            type="text"
            name="nameField"
            class="form-control"
            placeholder="John Doe"
          />
          <p id="nameReq">Name field is required</p>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label fw-semibold text-secondary">Email</label>
          <input
            type="email"
            name="emailField"
            class="form-control"
            placeholder="name@example.com"
          />
          <p id="emailReq">Email field is required</p>
          <p id="invalidEmail">Invalid Email format</p>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label fw-semibold text-secondary">Password</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Create password"
          />
          <p id="pwdReq">Password is required</p>
          <p id="invalidPwd">Password must be at least 6 characters</p>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label fw-semibold text-secondary">Confirm Password</label>
          <input
            type="password"
            name="confirmPassword"
            class="form-control"
            placeholder="Repeat password"
          />
          <p id="confirmPwdReq">Please confirm your password</p>
          <p id="pwdMismatch">Passwords do not match</p>
        </div>

        <button id="signupBtn" type="submit" class="btn btn-success btn-submit w-100">
          Sign Up
        </button>

        <p class="text-center text-secondary small mt-3 mb-0">
          Already have an account? <a href="login.html" class="text-warning text-decoration-none fw-semibold">Login</a>
        </p>
      </form>
    </div>

    <script>
      const form = document.forms["signupForm"];
      const nameField = form["nameField"];
      const emailField = form["emailField"];
      const passwordField = form["password"];
      const confirmPasswordField = form["confirmPassword"];

      const nameReq = document.getElementById("nameReq");
      const emailReq = document.getElementById("emailReq");
      const invalidEmail = document.getElementById("invalidEmail");
      const pwdReq = document.getElementById("pwdReq");
      const invalidPwd = document.getElementById("invalidPwd");
      const confirmPwdReq = document.getElementById("confirmPwdReq");
      const pwdMismatch = document.getElementById("pwdMismatch");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        let isValid = true;

        nameReq.style.display = "none";
        emailReq.style.display = "none";
        invalidEmail.style.display = "none";
        pwdReq.style.display = "none";
        invalidPwd.style.display = "none";
        confirmPwdReq.style.display = "none";
        pwdMismatch.style.display = "none";

        const nameVal = nameField.value.trim();
        if (nameVal === "") {
          nameReq.style.display = "block";
          isValid = false;
        }

        const emailVal = emailField.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (emailVal === "") {
          emailReq.style.display = "block";
          isValid = false;
        } else if (!emailRegex.test(emailVal)) {
          invalidEmail.style.display = "block";
          isValid = false;
        }

        const pwdVal = passwordField.value.trim();
        if (pwdVal === "") {
          pwdReq.style.display = "block";
          isValid = false;
        } else if (pwdVal.length < 6) {
          invalidPwd.style.display = "block";
          isValid = false;
        }

        const confirmVal = confirmPasswordField.value.trim();
        if (confirmVal === "") {
          confirmPwdReq.style.display = "block";
          isValid = false;
        } else if (pwdVal !== confirmVal) {
          pwdMismatch.style.display = "block";
          isValid = false;
        }

        if (isValid) {
          alert("Account created successfully!");
          form.reset();
        }
      });
    </script>
  </body>
</html>
